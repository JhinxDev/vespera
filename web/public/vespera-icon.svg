<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vsp-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1E29" />
      <stop offset="100%" stop-color="#11131A" />
    </linearGradient>
    <linearGradient id="vsp-cobalt" x1="14" y1="16" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="55%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="vsp-slate" x1="22" y1="18" x2="34" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B9ACC" />
      <stop offset="100%" stop-color="#4A6593" />
    </linearGradient>
    <linearGradient id="vsp-white" x1="42" y1="16" x2="29" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="vsp-silver" x1="50" y1="20" x2="38" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8C1E8" />
      <stop offset="100%" stop-color="#647EB0" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#vsp-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <!-- Recessed inner-left slice -->
  <polygon points="22.5,17.5 27.8,17.5 34.4,37.8 30.8,44.2" fill="url(#vsp-slate)" opacity="0.92" />
  <!-- Outer-right silver slice -->
  <polygon points="45.2,21.5 50.4,21.5 40.4,45.5 36.2,45.5" fill="url(#vsp-silver)" opacity="0.95" />
  <!-- Outer-left primary cobalt slice -->
  <polygon points="13.6,17.5 20.0,17.5 31.6,49.5 26.2,49.5" fill="url(#vsp-cobalt)" />
  <!-- Center-right bright white ascending slice -->
  <polygon points="39.2,17.5 45.6,17.5 32.0,49.5 26.2,49.5" fill="url(#vsp-white)" />
</svg>
